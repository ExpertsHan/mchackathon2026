name: ai-subsidy-copilot

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ai_subsidy
      POSTGRES_USER: subsidy
      POSTGRES_PASSWORD: subsidy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subsidy -d ai_subsidy"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://subsidy:subsidy@postgres:5432/ai_subsidy
      DEMO_MODE: "${DEMO_MODE:-true}"
      DEMO_AUTH_SECRET: "${DEMO_AUTH_SECRET:-local-demo-only-change-me}"
      AI_PROVIDER: "${AI_PROVIDER:-auto}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.7-flash}"
      GEMINI_OCR_MODEL: "${GEMINI_OCR_MODEL:-gemini-2.5-flash}"
      OCR_MODULE_DIR: /ocr
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      LINE_INTEGRATION_SECRET: "${LINE_INTEGRATION_SECRET:-}"
      LINE_CHANNEL_ACCESS_TOKEN: "${LINE_CHANNEL_ACCESS_TOKEN:-}"
      GEMINI_REASONING_EFFORT: "${GEMINI_REASONING_EFFORT:-low}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6-luna}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
      OPENAI_REASONING_EFFORT: "${OPENAI_REASONING_EFFORT:-none}"
      OPENAI_TIMEOUT_SECONDS: "${OPENAI_TIMEOUT_SECONDS:-20}"
      AGENT_MAX_OUTPUT_TOKENS: "${AGENT_MAX_OUTPUT_TOKENS:-600}"
      AGENT_MAX_TOOL_ROUNDS: "${AGENT_MAX_TOOL_ROUNDS:-2}"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      RECEIPT_STORAGE_DIR: /app/storage/receipts
      KNOWLEDGE_DIR: /knowledge
      DEMO_RECEIPTS_DIR: /demo/receipts
      MAX_RECEIPT_BYTES: "5242880"
      MAX_PDF_PAGES: "10"
      MAX_EXTRACTED_CHARS: "50000"
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/knowledge:ro
      - ./demo:/demo:ro
      - ./ocr:/ocr:ro
      - receipt_storage:/app/storage/receipts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # Optional LINE Bot (docker compose --profile line up). It holds no data: it calls the
  # backend's internal API, and the backend pushes notifications back through LINE.
  line-bot:
    profiles: ["line"]
    image: node:20-slim
    working_dir: /ocr
    command: ["sh", "-c", "npm install --omit=dev --no-audit --no-fund && node line-server.js"]
    environment:
      API_BASE_URL: http://backend:8000
      LINE_INTEGRATION_SECRET: "${LINE_INTEGRATION_SECRET:-}"
      LINE_CHANNEL_ACCESS_TOKEN: "${LINE_CHANNEL_ACCESS_TOKEN:-}"
      LINE_CHANNEL_SECRET: "${LINE_CHANNEL_SECRET:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      PORT: "3100"
    ports:
      - "3100:3100"
    volumes:
      - ./ocr:/ocr
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  receipt_storage:
